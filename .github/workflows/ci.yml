name: EcoTrack - CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    name: Build e testes
    runs-on: ubuntu-latest

    services:
      oracle:
        image: gvenzl/oracle-free:23-slim
        env:
          ORACLE_PASSWORD: ${{ secrets.CI_ORACLE_PASSWORD }}
          APP_USER: ecotrack
          APP_USER_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        ports:
          - 1521:1521
        options: >-
          --health-cmd="healthcheck.sh"
          --health-interval=30s
          --health-timeout=10s
          --health-retries=20
          --health-start-period=120s

    env:
      DB_URL: jdbc:oracle:thin:@//localhost:1521/FREEPDB1
      DB_USERNAME: ecotrack
      DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar e executar testes
        run: ./mvnw -B clean verify

      - name: Salvar relatórios dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-testes
          path: target/surefire-reports/
          if-no-files-found: ignore

  docker-build:
    name: Construir imagem Docker
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ecotrack:ci