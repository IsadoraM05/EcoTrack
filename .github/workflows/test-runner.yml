name: Testar Runner Docker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar-docker:
    runs-on:
      - self-hosted
      - Windows
      - X64

    steps:
      - name: Verificar Docker
        shell: powershell
        run: |
          docker version
          if ($LASTEXITCODE -ne 0) { exit 1 }

          docker compose version
          if ($LASTEXITCODE -ne 0) { exit 1 }

          docker ps
          if ($LASTEXITCODE -ne 0) { exit 1 }